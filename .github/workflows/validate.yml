name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Version bump for shipped changes
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.js "origin/${{ github.base_ref }}"
